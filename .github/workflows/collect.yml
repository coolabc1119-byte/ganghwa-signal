name: 강화 시그널 데이터 수집

on:
  schedule:
    - cron: "30 22 * * *"   # 매일 KST 07:30 (UTC 22:30) — 데이터랩 전날치가 올라온 뒤
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼
  push:                     # 설정·코드를 바꿔 올리면 즉시 수집
    branches: [main]
    paths:
      - "keywords.json"
      - "collect.py"
      - ".github/workflows/collect.yml"
      - ".run"                  # 이 파일만 바꿔 올려도 즉시 수집(재확인용)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect.py
      - name: 결과 커밋
        run: |
          git config user.name "ganghwa-signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d') 자동 수집"
          git pull --rebase origin main || true
          git push
